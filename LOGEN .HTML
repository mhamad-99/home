<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login / Sign Up</title>
    <link rel="stylesheet" href="calar.css">
    <style>
        body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:linear-gradient(180deg,var(--bg),#071027 95%);}
        .auth-card{width:100%;max-width:480px;padding:2.5rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,0.18);}
        .auth-card h1{margin:0 0 0.75rem;font-size:clamp(1.75rem,4vw,2.6rem);letter-spacing:.02em}
        .auth-card p{margin:0 0 1.25rem;color:var(--muted);line-height:1.8}
        .auth-tabs{display:flex;gap:.75rem;margin-bottom:1.5rem}
        .auth-tab{flex:1;padding:.9rem 1rem;border-radius:14px;text-align:center;background:rgba(255,255,255,0.04);color:#cbd5e1;cursor:pointer;border:1px solid rgba(255,255,255,0.08);transition:.2s}
        .auth-tab.active{background:linear-gradient(90deg,var(--accent-1),var(--accent-2));color:#021025;border-color:transparent}
        .form-group{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1rem}
        .form-group label{font-size:.95rem;color:#d3dce5}
        .form-group input{width:100%;padding:.95rem 1rem;border-radius:14px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:#f8fbff;outline:none;transition:.2s;border-color:rgba(255,255,255,0.12)}
        .form-group input:focus{border-color:rgba(110,231,183,.85);box-shadow:0 0 0 4px rgba(110,231,183,.08)}
        .auth-actions{display:flex;flex-direction:column;gap:.9rem;margin-top:1rem}
        .auth-actions .btn{width:100%;text-align:center}
        .auth-footer{display:flex;justify-content:space-between;gap:1rem;font-size:.92rem;color:var(--muted);margin-top:1rem}
        .auth-footer a{color:var(--accent-1);text-decoration:none;cursor:pointer}
        .message{margin-top:1rem;font-size:.95rem;min-height:1.2rem;color:#f87171}
        .message.success{color:#86efac}
        @media (max-width:520px){body{padding:1rem}.auth-card{padding:1.75rem}}
    </style>
</head>
<body>
    <main class="auth-card">
        <h1>Access the site</h1>
        <p>Create an account and then log in to use the full website.</p>
        <div class="auth-tabs">
            <button id="loginTab" class="auth-tab active" type="button">Login</button>
            <button id="signupTab" class="auth-tab" type="button">Create Account</button>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginUsername">Username</label>
                <input id="loginUsername" type="text" name="loginUsername" placeholder="username" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password" name="loginPassword" placeholder="Enter your password" required>
            </div>
            <div class="auth-actions">
                <button type="submit" class="btn primary">Login</button>
            </div>
            <div class="message" id="loginMessage"></div>
        </form>

        <form id="signupForm" style="display:none;">
            <div class="form-group">
                <label for="signupUsername">Username</label>
                <input id="signupUsername" type="text" name="signupUsername" placeholder="username" required>
            </div>
            <div class="form-group">
                <label for="signupPassword">Password</label>
                <input id="signupPassword" type="password" name="signupPassword" placeholder="Enter password" required>
            </div>
            <div class="form-group">
                <label for="signupConfirm">Confirm Password</label>
                <input id="signupConfirm" type="password" name="signupConfirm" placeholder="Repeat password" required>
            </div>
            <div class="auth-actions">
                <button type="submit" class="btn primary">Create Account</button>
            </div>
            <div class="message" id="signupMessage"></div>
        </form>
    </main>
    <script>
        const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const loginMessage = document.getElementById('loginMessage');
        const signupMessage = document.getElementById('signupMessage');

        function showLogin() {
            loginTab.classList.add('active');
            signupTab.classList.remove('active');
            signupForm.style.display = 'none';
            loginForm.style.display = 'block';
            loginMessage.textContent = '';
            signupMessage.textContent = '';
        }

        function showSignup() {
            signupTab.classList.add('active');
            loginTab.classList.remove('active');
            loginForm.style.display = 'none';
            signupForm.style.display = 'block';
            loginMessage.textContent = '';
            signupMessage.textContent = '';
        }

        loginTab.addEventListener('click', showLogin);
        signupTab.addEventListener('click', showSignup);

        async function postJson(path, body) {
            const response = await fetch(path, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const result = await response.json();
            return {response, result};
        }

        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const username = loginForm.loginUsername.value.trim();
            const password = loginForm.loginPassword.value;
            const {response, result} = await postJson('/api/login', {username, password});
            if (!response.ok) {
                loginMessage.textContent = result.message || 'Invalid username or password.';
                loginMessage.classList.remove('success');
                return;
            }
            localStorage.setItem('loggedIn', 'true');
            localStorage.setItem('loggedInUser', username);
            location.replace('home.html');
        });

        signupForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const username = signupForm.signupUsername.value.trim();
            const password = signupForm.signupPassword.value;
            const confirm = signupForm.signupConfirm.value;
            if (!username || !password || !confirm) {
                signupMessage.textContent = 'Please complete every field.';
                signupMessage.classList.remove('success');
                return;
            }
            if (password !== confirm) {
                signupMessage.textContent = 'Passwords do not match.';
                signupMessage.classList.remove('success');
                return;
            }
            if (password.length < 6) {
                signupMessage.textContent = 'Password must be at least 6 characters.';
                signupMessage.classList.remove('success');
                return;
            }
            const {response, result} = await postJson('/api/signup', {username, password});
            if (!response.ok) {
                signupMessage.textContent = result.message || 'Unable to create account.';
                signupMessage.classList.remove('success');
                return;
            }
            signupMessage.textContent = 'Account created successfully. Please login.';
            signupMessage.classList.add('success');
            showLogin();
            loginForm.loginUsername.value = username;
            loginForm.loginPassword.value = '';
        });
    </script>
</body>
</html>
